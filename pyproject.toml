[project]
name = "ai-fund-management-platform"
version = "0.2.0"
description = "本地运行的基金净值、来源追踪与组合分析演示工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.37",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.31",
  "plotly>=5.22",
  "openai>=1.40",
  "tabulate>=0.9",
  "lxml>=5.2",
  "akshare>=1.15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
