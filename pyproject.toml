[project]
name = "fund-lens"
version = "0.6.1"
description = "本地运行的基金净值来源追踪与组合分析演示工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.37",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.31",
  "plotly>=5.22",
  "openai>=1.40",
  "tabulate>=0.9",
  "lxml>=5.2",
  "akshare>=1.15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Start with pyflakes (undefined names, unused variables, duplicate keys) so the
# gate is meaningful without a large style-only diff. Widen to I/UP/B later.
select = ["E9", "F"]
ignore = ["F401"]  # re-exports and side-effect imports

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
